<!-- register.html -->

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vivid Thought</title>
    <link rel="stylesheet" href="styles/universal.css" />
    <link rel="stylesheet" href="styles/login.css" />
  </head>
  <body>
    <div class="background-blobs">
      <div class="blob blob1"></div>
      <div class="blob blob2"></div>
      <div class="blob blob3"></div>
    </div>
    <div class="centre-vh">
      <img src="assets/icons/logo.svg" alt="Vivid Thought Logo" class="logo" />
      <p class="large">Welcome to Vivid Thought!<br /></p>
      <p class="small">Please register to continue.<br /></p>
      <br/>
      <div class="input-group">
        <input type="text" id="regEmail" required />
        <label for="regEmail">Email</label>
      </div>
      <div class="input-group">
        <input type="password" id="regPassword" required />
        <label for="regPassword">Password</label>
      </div>
      <p id="message"></p>
      <br/>
      <a onclick="register()">Register</a>
      <a href="login.html">Already Have an Account</a>
      <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
      <script defer src="scripts/app.js"></script>
    </div>
  </body>
</html>
